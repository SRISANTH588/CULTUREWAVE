<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CultureWave — One-time Admin Setup</title>
  <style>
    body { font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; background: #f0f4ff; margin: 0; }
    .card { background: #fff; border-radius: 20px; padding: 2.5rem; max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(18,66,197,.12); }
    h2 { margin: 0 0 .5rem; color: #1242c5; }
    p { color: #666; font-size: .9rem; margin: 0 0 1.5rem; }
    button { width: 100%; padding: 1rem; background: #1242c5; color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #status { margin-top: 1.2rem; padding: 1rem; border-radius: 10px; font-size: .9rem; font-weight: 600; display: none; }
    .success { background: #dcfce7; color: #166534; display: block !important; }
    .error   { background: #fee2e2; color: #991b1b; display: block !important; }
    .info    { background: #eff6ff; color: #1e40af; display: block !important; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Setup</h2>
    <p>Creates the admin account in Firebase Auth + Firestore. Run this once only.</p>
    <button id="btn" onclick="setup()">Create Admin Account</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyBCgNQy8EJLg7E-SA1cMePGetWLOR7WWMI",
      authDomain: "ogshootsluxe-36740.firebaseapp.com",
      projectId: "ogshootsluxe-36740",
      storageBucket: "ogshootsluxe-36740.firebasestorage.app",
      messagingSenderId: "5471814825",
      appId: "1:5471814825:web:07e84f2f88486da817d5b8"
    });
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ACCOUNTS = [
      { username: "SRISANTH", password: "SASI@2006", name: "Srisanth", role: "admin" },
      { username: "SASI",     password: "sasi",      name: "Sasi",     role: "client" },
    ];

    window.setup = async function () {
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.className = "info";
      status.textContent = "Creating accounts...";

      const results = [];
      for (const acc of ACCOUNTS) {
        const email = `${acc.username.toLowerCase()}@cityvibe.local`;
        try {
          const { user } = await createUserWithEmailAndPassword(auth, email, acc.password);
          await setDoc(doc(db, "users", user.uid), {
            name: acc.name,
            email,
            role: acc.role,
            createdAt: Date.now(),
          });
          results.push(`✅ ${acc.username} (${acc.role}) created`);
        } catch (err) {
          if (err.code === "auth/email-already-in-use") {
            results.push(`⚠️ ${acc.username} already exists — skipped`);
          } else {
            results.push(`❌ ${acc.username} failed: ${err.message}`);
          }
        }
      }

      status.className = "success";
      status.innerHTML = results.join("<br>") + "<br><br>Done! You can now <a href='login.html'>login</a>.";
      btn.disabled = false;
    };
  </script>
</body>
</html>
