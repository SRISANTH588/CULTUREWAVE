<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>One Club | CultureWave</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#f5f3f8;font-family:Inter,system-ui,sans-serif}.page{max-width:720px;margin:auto;padding:1rem 1rem 3rem}.head{display:flex;align-items:center;gap:1rem;height:62px}.back{width:44px;height:44px;border:1px solid #393740;border-radius:50%;background:#1b1a20;color:#fff;font-size:1.6rem}.head h1{margin:0;font-size:1.2rem}.balance{margin:1rem 0 1.2rem;padding:1.5rem;border:1px solid #6948a0;border-radius:24px;background:radial-gradient(ellipse at 10% 0,#39205c,#201b29 75%)}.eyebrow{color:#c3a3ee;font-size:.8rem;font-weight:800;letter-spacing:.13em}.amount{margin:.5rem 0 1.2rem;font-size:2.5rem;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:.7rem}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 1.1rem;border-radius:999px;background:#f6f4f8;color:#17151c;text-decoration:none;font-weight:800}.actions a.secondary{border:1px solid #55515d;background:transparent;color:#f5f3f8}.section-title{margin:1.7rem 0 .8rem;font-size:1.05rem}.panel{overflow:hidden;border:1px solid #343239;border-radius:20px;background:#1c1b20}.item{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:70px;padding:1rem}.item+.item{border-top:1px solid #343239}.item strong{display:block}.item span{display:block;margin-top:.3rem;color:#a6a2ac;font-size:.83rem}.notice{padding:1.2rem;color:#aaa7b2;text-align:center}
  </style>
</head>
<body><main class="page">
  <header class="head"><button class="back" id="back" aria-label="Back">‹</button><h1>One Club</h1></header>
  <section class="balance"><div class="eyebrow">CULTUREWAVE BALANCE</div><div class="amount" id="balance">₹—</div><div class="actions"><a href="buy-gift-card.html">Add money</a><a class="secondary" href="claim-gift-card.html">Claim gift card</a></div></section>
  <h2 class="section-title">Use your balance</h2><section class="panel"><a class="item" href="events.html" style="color:inherit;text-decoration:none"><div><strong>Book event tickets</strong><span>Use One Club balance during ticket checkout</span></div><b>›</b></a></section>
  <h2 class="section-title">Gift card activity</h2><section class="panel" id="history"><div class="notice">Loading activity…</div></section>
</main><script type="module">
import { auth } from './firebase.js';
const api='https://culturewave-razorpay.culturewaveindia.workers.dev';document.getElementById('back').onclick=()=>{if(parent!==window)parent.postMessage({type:'culturewave-menu-back'},location.origin);else history.back()};
(async()=>{await auth.authStateReady();const user=auth.currentUser;if(!user){document.getElementById('history').innerHTML='<div class="notice">Sign in to view your One Club balance and activity.<br><a href="login.html?next=one-club.html">Sign in</a></div>';document.getElementById('balance').textContent='Sign in';return}try{const token=await user.getIdToken(),[balanceResponse,historyResponse]=await Promise.all([fetch(`${api}/oneClubBalance`,{method:'POST',headers:{Authorization:`Bearer ${token}`}}),fetch(`${api}/giftCardHistory`,{method:'POST',headers:{Authorization:`Bearer ${token}`}})]),balance=await balanceResponse.json(),history=await historyResponse.json();if(!balanceResponse.ok||!balance.success)throw new Error(balance.error||'Could not load balance.');document.getElementById('balance').textContent=`₹${Number(balance.balance).toLocaleString('en-IN')}`;const purchases=historyResponse.ok&&history.success?history.purchases:[],transactions=historyResponse.ok&&history.success?history.transactions:[],items=[...purchases.map(item=>({kind:'gift',date:item.createdAt,amount:item.amount,status:item.status})),...transactions.map(item=>({kind:'ticket',date:item.createdAt,amount:item.amount,status:item.type}))].sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('history').innerHTML=items.length?items.map(item=>`<article class="item"><div><strong>${item.kind==='gift'?'Gift card · ₹'+Number(item.amount).toLocaleString('en-IN'):'Ticket booking · ₹'+Math.abs(Number(item.amount)).toLocaleString('en-IN')}</strong><span>${item.kind==='gift'?(item.status==='redeemed'?'Added to One Club':'Purchased'): 'Used for tickets'} · ${new Date(item.date).toLocaleDateString('en-IN')}</span></div><b>${item.kind==='gift'&&item.status==='redeemed'?'✓':'›'}</b></article>`).join(''):'<div class="notice">No One Club activity yet.</div>'}catch(error){document.getElementById('history').innerHTML=`<div class="notice">${error.message}</div>`}})();
</script></body></html>
