<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey | CultureWave</title>
  <meta name="robots" content="noindex, nofollow"/><style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.card{max-width:620px;margin:8vh auto;padding:2rem;background:#fff;border-radius:18px;box-shadow:0 12px 40px #10204018}h1{margin:0 0 .5rem}p{color:#64748b;line-height:1.5}label{font-weight:700;font-size:.88rem;display:block;margin:1.1rem 0 .4rem}input,textarea{box-sizing:border-box;width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:110px}button{margin-top:1.5rem;width:100%;padding:.85rem;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}.state{text-align:center;padding:2rem;color:#64748b}</style></head><body><main class="card" id="app"><div class="state">Loading form…</div></main><script type="module">import{db,doc,getDoc,collection,addDoc,serverTimestamp}from'./firebase.js';const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('formId');const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));if(!id){app.innerHTML='<div class="state">This form link is invalid.</div>'}else{const snap=await getDoc(doc(db,'surveys',id));if(!snap.exists()||snap.data().active===false){app.innerHTML='<div class="state">This form is no longer available.</div>'}else{const form=snap.data(),qs=form.questions||[];app.innerHTML=`<h1>${esc(form.title)}</h1>${form.eventName?`<p>For ${esc(form.eventName)}</p>`:'<p>Please complete this form.</p>'}<form id="form">${qs.map(q=>`<label>${esc(q.label)}${q.required?' *':''}</label>${q.type==='textarea'?`<textarea name="${esc(q.id)}" ${q.required?'required':''}></textarea>`:`<input type="${esc(q.type||'text')}" name="${esc(q.id)}" ${q.required?'required':''}>`}`).join('')}<button>Submit</button></form>`;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Submitting…';const answers=Object.fromEntries(new FormData(e.target));try{await addDoc(collection(db,'surveyResponses'),{surveyId:id,ownerId:form.ownerId,eventId:form.eventId||null,answers,createdAt:serverTimestamp()});app.innerHTML='<div class="state"><h2>Thank you!</h2><p>Your response has been recorded.</p></div>'}catch(err){b.disabled=false;b.textContent='Submit';alert('Could not submit: '+err.message)}}}}</script></body></html>
