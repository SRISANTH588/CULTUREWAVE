async function renderExplore(currentId,data){const tags=[...(Array.isArray(data.tags)?data.tags:[]),data.cuisine,data.city].filter(Boolean);$('exploreTags').innerHTML=tags.slice(0,8).map(tag=>`<span>${esc(tag)}</span>`).join('');try{const snap=await db.collection('restaurants').get();const others=snap.docs.filter(item=>item.id!==currentId&&isPublic(item.data())).slice(0,12);$('exploreList').innerHTML=others.length?others.map(item=>{const d=item.data(),image=validImageUrl(d.coverUrl);return `<a class="explore-card" href="restaurant.html?id=${encodeURIComponent(item.id)}">${image?`<img src="${esc(image)}" alt="" loading="lazy">`:'<div style="height:130px;display:grid;place-items:center;background:#28262d">🍽️</div>'}<div><b>${esc(d.name||'Restaurant')}</b><small>${esc([d.cuisine,d.area||d.city].filter(Boolean).join(' · ')||'Dining')}</small></div></a>`}).join(''):'<div class="empty">No other restaurants to show yet.</div>'}catch{$('exploreList').innerHTML='<div class="empty">Explore nearby restaurants on the dining page.</div>'}}
async function load(){const params=new URLSearchParams(location.search),id=params.get('id')||params.get('restaurantId');if(!id){$('loading').innerHTML='<div><h1>Restaurant not found</h1><p>Choose a restaurant from the dining page.</p><a href="restaurants.html">Back to restaurants</a></div>';return}try{const snap=await Promise.race([db.collection('restaurants').doc(id).get(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Restaurant details are taking too long to load. Check your connection and try again.')),12000))]);if(!snap.exists||!isPublic(snap.data()))throw Error('This restaurant is not currently listed.');const data=snap.data();restaurantData=data;$('loading').hidden=true;$('restaurantPage').hidden=false;$('fixedBooking').hidden=false;document.title=`${data.name||'Restaurant'} | CultureWave`;$('name').textContent=data.name||'Restaurant';$('navTitle').textContent=data.name||'Restaurant';$('fixedName').textContent=data.name||'this restaurant';const cuisines=Array.isArray(data.tags)?data.tags.slice(0,3):[];if(data.cuisine)cuisines.unshift(data.cuisine);$('cuisines').textContent=[...new Set(cuisines)].join(', ')||data.category||'Restaurant';const price=data.priceForTwo||data.price||0;$('summaryInfo').innerHTML=`<div>${money(price)} for two <span style="margin:0 8px">·</span>${esc(data.area||data.city||'Location unavailable')} ${data.state?`· ${esc(data.state)}`:''}</div><div>${esc(data.openingHours||[data.openingTime,data.closingTime].filter(Boolean).join(' to ')||'Hours may vary')} ${data.status==='published'?'· Open for reservations':''}</div>`;const cover=validImageUrl(data.coverUrl);if(cover)$('gallery').style.backgroundImage=`linear-gradient(#0002,#0002),url(${JSON.stringify(cover)})`;$('ratingBadge').hidden=!Number(data.rating);const items=Array.isArray(data.menuItems)?data.menuItems:[];photos=[cover,...(Array.isArray(data.galleryImages)?data.galleryImages:[]),...(Array.isArray(data.gallery)?data.gallery:[]),...(Array.isArray(data.photos)?data.photos:[]),...items.map(item=>item.imageUrl||item.image)].filter(Boolean);renderGallery();const booking=new URL('booking.html',location.href);booking.searchParams.set('type','restaurant');booking.searchParams.set('name',data.name||'');booking.searchParams.set('venue',data.area||data.city||'');booking.searchParams.set('price',String(price));$('bookTable').href=booking.href;$('orderFood').href=`food-order.html?restaurantId=${encodeURIComponent(id)}`;$('callAction').hidden=!data.contactPhone;$('callAction').href=data.contactPhone?`tel:${String(data.contactPhone).replace(/[^+\d]/g,'')}`:'#';$('directionAction').hidden=!data.mapLink;$('directionAction').href=validImageUrl(data.mapLink)||'#';$('directionAction').target='_blank';$('offers').hidden=false;renderOffers(Array.isArray(data.offers)?data.offers:Array.isArray(data.coupons)?data.coupons:[]);renderMenu(items);$('menuSearch').addEventListener('input',()=>renderMenu(items));renderReviews(data);await renderExplore(id,data);const saved=localStorage.getItem(`cw_saved_restaurant_${id}`)==='1';const updateSave=()=>{for(const button of [$('saveRestaurant'),$('saveRestaurantGallery')])button.textContent=saved?'♥':'♡'};updateSave();for(const button of [$('saveRestaurant'),$('saveRestaurantGallery')])button.addEventListener('click',()=>{const next=localStorage.getItem(`cw_saved_restaurant_${id}`)!=='1';localStorage.setItem(`cw_saved_restaurant_${id}`,next?'1':'0');for(const b of [$('saveRestaurant'),$('saveRestaurantGallery')])b.textContent=next?'♥':'♡'});}catch(error){$('loading').innerHTML=`<div><h1>Restaurant unavailable</h1><p class="error">${esc(error.message||'Could not load this restaurant.')}</p><a href="restaurants.html">Back to restaurants</a></div>`}}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));document.getElementById(tab.dataset.target).scrollIntoView({behavior:'smooth',block:'start'})}));$('viewGallery').addEventListener('click',()=>openGallery(0));$('prevGallery').addEventListener('click',()=>stepGallery(-1));$('nextGallery').addEventListener('click',()=>stepGallery(1));$('closeLightbox').addEventListener('click',()=>$('lightbox').classList.remove('open'));document.addEventListener('keydown',event=>{if(event.key==='Escape')$('lightbox').classList.remove('open');if(event.key==='ArrowRight')stepGallery(1);if(event.key==='ArrowLeft')stepGallery(-1)});$('lightbox').addEventListener('click',event=>{if(event.target===$('lightbox'))$('lightbox').classList.remove('open')});$('seeReviews').addEventListener('click',()=>{$('reviewList').scrollIntoView({behavior:'smooth',block:'start'})});window.shareRestaurant=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Restaurant link copied.')}}catch(error){if(error?.name!=='AbortError')alert('Could not share this restaurant.')}};load();
</script></body></html>
