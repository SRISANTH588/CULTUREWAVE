name = "culturewave-razorpay"
main = "src/index.js"
compatibility_date = "2026-10-09"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://culturewave.in,https://www.culturewave.in"

[observability]
enabled = true

# Set the credentials with `wrangler secret put RAZORPAY_KEY_ID` and
# `wrangler secret put RAZORPAY_KEY_SECRET`. Never put them in this file.
