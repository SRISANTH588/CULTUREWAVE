<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Event Booking</title></head>
<body>
<script>
  const p = new URLSearchParams(location.search);
  const eventId = p.get('eventId');
  if (eventId) location.replace('booking.html?eventId=' + encodeURIComponent(eventId));
  else location.replace('events.html');
</script>
</body>
</html>
