<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Shop | CultureWave</title><meta name="description" content="Browse products from local CultureWave shops."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--accent:#8a6a38;--accent-soft:#f2eadc;--ink:#25231f;--muted:#77756f;--line:#e9e6df;--page:#f8f7f4}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px Manrope,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.top{height:66px;padding:0 max(5vw,18px);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:-.05em;font-size:1.1rem}.brand b{color:var(--accent)}.back{font-size:.8rem;font-weight:800;color:var(--accent)}.hero{background:linear-gradient(125deg,#29251f,#635039);color:#fff;min-height:235px;display:flex;align-items:flex-end;background-size:cover;background-position:center;position:relative}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#17140fd9,#17140f65)}.hero-inner{position:relative;width:min(1120px,calc(100% - 36px));margin:0 auto;padding:30px 0}.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.15em;color:#e9d5ad;font-weight:900}.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-.055em;margin:9px 0}.hero p{color:#e0dbd2;margin:0;line-height:1.6}.main{width:min(1120px,calc(100% - 36px));margin:24px auto 60px}.toolbar{display:grid;grid-template-columns:minmax(190px,1fr) auto auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 15px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 13px;color:#69665f;font-size:.75rem;font-weight:800;cursor:pointer}.filter.active,.filter:hover{border-color:var(--accent);background:var(--accent);color:#fff}.count{font-size:.77rem;color:var(--muted);margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.product{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.18s}.product:hover{transform:translateY(-2px);box-shadow:0 12px 28px #29251f12}.product-image{height:205px;background:linear-gradient(135deg,#eee8dd,#d9ceb9);display:grid;place-items:center;position:relative}.product-image img{height:100%;width:100%;object-fit:cover}.product-placeholder{font-size:3.3rem}.stock-badge{position:absolute;left:11px;top:11px;border-radius:99px;background:#ffffffed;padding:5px 9px;font-size:.64rem;font-weight:900;color:#4f493d}.stock-badge.out{background:#fff0ed;color:#a33b30}.product-body{padding:14px}.product-category{font-size:.65rem;color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:.1em}.product h2{font-size:.94rem;line-height:1.35;margin:6px 0}.product-description{min-height:2.7em;color:var(--muted);font-size:.75rem;line-height:1.55}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.price{font-size:.95rem;font-weight:900}.old-price{margin-left:5px;color:#96928a;text-decoration:line-through;font-size:.72rem;font-weight:600}.contact{padding:8px 11px;border-radius:9px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:900;white-space:nowrap}.empty{grid-column:1/-1;padding:55px 20px;border:1px dashed #d8d2c8;border-radius:16px;background:#fff;text-align:center;color:var(--muted);line-height:1.65}.empty strong{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:7px}.loading{padding:50px 10px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:9px}.product-image{height:155px}.product-body{padding:11px}.product h2{font-size:.83rem}.product-description{font-size:.7rem}.contact{font-size:.64rem;padding:7px 8px}.price{font-size:.85rem}.main{width:calc(100% - 22px);margin-top:17px}.hero{min-height:195px}.hero-inner{width:calc(100% - 26px)}.toolbar{gap:7px}.toolbar input,.toolbar select{font-size:.78rem;padding:10px}.top{height:59px;padding:0 13px}}
</style></head><body><header class="top"><a class="brand" href="stores.html">Culture<b>Wave</b> Shops</a><a class="back" href="stores.html">← All shops</a></header><section id="shopHero" class="hero"><div class="hero-inner"><div class="eyebrow">Local shop</div><h1 id="shopName">Loading shop…</h1><p id="shopSummary"></p></div></section><main class="main"><div class="toolbar"><input id="productSearch" type="search" placeholder="Search products, sweets, groceries…"><select id="categorySelect" aria-label="Filter by product category"><option value="all">All categories</option></select><select id="sortSelect" aria-label="Sort products"><option value="featured">Featured</option><option value="name">Name A–Z</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div><div id="categoryFilters" class="filters" aria-label="Product category filters"></div><div id="productCount" class="count">Loading items…</div><section id="productGrid" class="grid"><div class="loading">Loading shop items…</div></section></main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=value=>'₹'+Number(value||0).toLocaleString('en-IN'),slug=value=>String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let shopId='',shop={},products=[],activeCategory='all';const params=new URLSearchParams(location.search);shopId=params.get('shopId')||params.get('id')||'';function kindEmoji(product){const text=slug([product.name,product.category].join(' '));if(/sweet|mithai|dessert|cake|chocolate|laddu|barfi/.test(text))return'🍬';if(/fruit|vegetable|produce|grocery|rice|grain|dal/.test(text))return'🥬';if(/bread|bakery|bake/.test(text))return'🥖';if(/drink|juice|beverage/.test(text))return'🥤';return'🛍️'}function categories(){return[...new Set(products.map(p=>String(p.category||'Other').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function renderFilters(){const cats=categories();$('categorySelect').innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('categoryFilters').innerHTML=['all',...cats].map(c=>`<button class="filter ${activeCategory===c?'active':''}" type="button" data-category="${esc(c)}">${c==='all'?'All items':esc(c)}</button>`).join('');$('categoryFilters').querySelectorAll('[data-category]').forEach(btn=>btn.addEventListener('click',()=>{activeCategory=btn.dataset.category;$('categorySelect').value=activeCategory;renderFilters();renderProducts()}))}function renderProducts(){const term=slug($('productSearch').value),sort=$('sortSelect').value;let list=products.filter(p=>(activeCategory==='all'||p.category===activeCategory)&&(!term||slug([p.name,p.category,p.description,p.sku].join(' ')).includes(term)));if(sort==='name')list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));if(sort==='price-asc')list.sort((a,b)=>Number(a.salePrice??a.price)-Number(b.salePrice??b.price));if(sort==='price-desc')list.sort((a,b)=>Number(b.salePrice??b.price)-Number(a.salePrice??a.price));$('productCount').textContent=`${list.length} item${list.length===1?'':'s'}${activeCategory!=='all'?' · '+activeCategory:''}`;if(!list.length){$('productGrid').innerHTML=`<div class="empty"><strong>${products.length?'No matching items':'No products listed yet'}</strong>${products.length?'Try another search or category.':'This shop has not added its products yet. Check back soon.'}</div>`;return}$('productGrid').innerHTML=list.map(p=>{const out=Number(p.stock||0)<=0,price=Number(p.salePrice??p.price),hasSale=p.salePrice!==null&&p.salePrice!==undefined&&Number(p.salePrice)<Number(p.price),img=p.imageUrl||'';const phone=String(shop.phone||shop.contactPhone||shop.whatsapp||'').replace(/\D/g,'');const message=encodeURIComponent(`Hi ${shop.name||'there'}, I am interested in ${p.name}${p.sku?' ('+p.sku+')':''}.`);const action=phone&&!out?`<a class="contact" href="https://wa.me/${phone}?text=${message}" target="_blank" rel="noopener">Ask to order</a>`:`<span class="contact" style="background:#b8b3aa">${out?'Out of stock':'Contact shop'}</span>`;return `<article class="product"><div class="product-image">${img?`<img src="${esc(img)}" alt="${esc(p.name||'Shop product')}" loading="lazy">`:`<span class="product-placeholder">${kindEmoji(p)}</span>`}<span class="stock-badge ${out?'out':''}">${out?'Out of stock':`In stock · ${Number(p.stock)} left`}</span></div><div class="product-body"><div class="product-category">${esc(p.category||'Other')}</div><h2>${esc(p.name||'Shop item')}</h2><p class="product-description">${esc(p.description||'Available from this local shop.')}</p><div class="product-bottom"><div class="price">${money(price)}${hasSale?`<span class="old-price">${money(p.price)}</span>`:''}</div>${action}</div></div></article>`}).join('')}async function load(){if(!shopId){$('shopName').textContent='Shop not found';$('productGrid').innerHTML='<div class="empty"><strong>No shop selected</strong>Return to Shops and choose a store.</div>';return}try{if(!window.firebase||!firebase.apps.length)throw Error('Shop catalog is unavailable right now.');const db=firebase.firestore(),shopSnap=await db.collection('shops').doc(shopId).get();if(!shopSnap.exists||shopSnap.data().published!==true)throw Error('This shop is not currently listed.');shop={id:shopSnap.id,...shopSnap.data()};$('shopName').textContent=shop.name||'Local shop';document.title=`${shop.name||'Shop'} | CultureWave Shops`;const details=[shop.category,shop.area||shop.city].filter(Boolean).join(' · ');$('shopSummary').textContent=details||shop.description||'Browse items from this neighborhood shop.';const cover=shop.coverUrl||shop.imageUrl||'';if(cover)$('shopHero').style.backgroundImage=`linear-gradient(90deg,#17140fd9,#17140f65),url("${String(cover).replace(/["\\]/g,'')}")`;const snapshot=await db.collection('shopProducts').where('shopId','==',shopId).where('active','==',true).get();products=snapshot.docs.map(d=>({id:d.id,...d.data()}));renderFilters();renderProducts()}catch(error){$('shopName').textContent=shop.name||'Shop unavailable';$('productCount').textContent='';$('productGrid').innerHTML=`<div class="empty"><strong>Could not load shop items</strong>${esc(error.message||'Try again in a moment.')}</div>`}}$('productSearch').addEventListener('input',renderProducts);$('categorySelect').addEventListener('change',()=>{activeCategory=$('categorySelect').value;renderFilters();renderProducts()});$('sortSelect').addEventListener('change',renderProducts);load()})();
</script></body></html>
