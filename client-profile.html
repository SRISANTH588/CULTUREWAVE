<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CultureWave | Organiser Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    :root{--blue:#1242c5;--blue-2:#2f6bff;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--border:#dce4f5;--muted:#64748b;--text:#0a0f1e;}
    body{background:#f0f4ff;font-size:14px;min-height:100vh;}
    *{box-sizing:border-box;margin:0;padding:0;}
    a{text-decoration:none;color:inherit;}
    button{font:inherit;cursor:pointer;}

    /* HERO BANNER */
    .banner{height:320px;background:linear-gradient(135deg,#0a0f1e 0%,#1242c5 55%,#2f6bff 100%);position:relative;overflow:hidden;}
    .banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;}
    .banner::before{content:'';position:absolute;top:-80px;right:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.4) 0%,transparent 70%);pointer-events:none;}
    .banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,transparent,rgba(10,15,30,.6));pointer-events:none;}
    .banner-edit{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:.4rem .9rem;font-size:.76rem;font-weight:800;backdrop-filter:blur(8px);display:none;cursor:pointer;z-index:2;transition:background .2s;}
    .banner-edit:hover{background:rgba(255,255,255,.25);}

    /* PROFILE */
    .profile-wrap{max-width:1140px;margin:0 auto;padding:0 1.5rem;}
    .profile-head{display:flex;align-items:flex-end;gap:1.4rem;margin-top:-64px;margin-bottom:1.6rem;flex-wrap:wrap;position:relative;z-index:2;}
    .avatar{width:120px;height:120px;border-radius:28px;border:4px solid #fff;background:linear-gradient(135deg,var(--blue),var(--blue-2));display:grid;place-items:center;font-size:2.6rem;font-weight:900;color:#fff;flex:none;box-shadow:0 10px 32px rgba(18,66,197,.3);overflow:hidden;position:relative;z-index:2;}
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .profile-meta{flex:1;padding-bottom:.3rem;min-width:200px;padding-top:68px;}
    .profile-name-row{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;margin-bottom:.2rem;}
    .profile-meta h1{font-size:1.8rem;font-weight:900;letter-spacing:-.05em;color:var(--text);}
    .verified-badge{display:inline-flex;align-items:center;gap:.3rem;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;font-size:.65rem;font-weight:900;padding:.22rem .6rem;border-radius:999px;letter-spacing:.06em;}
    .premium-badge{display:inline-flex;align-items:center;gap:.3rem;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-size:.65rem;font-weight:900;padding:.22rem .6rem;border-radius:999px;letter-spacing:.06em;}
    .profile-handle{font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:.4rem;}
    .profile-bio{font-size:.9rem;color:#475569;line-height:1.6;max-width:540px;margin-bottom:.5rem;}
    .socials{display:flex;gap:.45rem;flex-wrap:wrap;}
    .social-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .75rem;border-radius:999px;background:#f1f5f9;border:1px solid var(--border);font-size:.74rem;font-weight:700;color:var(--muted);transition:all .2s;}
    .social-chip:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
    .profile-actions{display:flex;gap:.6rem;align-items:center;padding-bottom:.3rem;flex-wrap:wrap;margin-left:auto;}
    .btn{border:0;border-radius:12px;padding:.6rem 1.1rem;font-weight:800;font-size:.84rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .15s,box-shadow .15s;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 6px 18px rgba(18,66,197,.3);}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(18,66,197,.4);}
    .btn-ghost{background:#fff;color:var(--text);border:1.5px solid var(--border);}
    .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}

    /* STATS */
    .stats-row{display:flex;gap:0;border:1px solid var(--border);border-radius:20px;background:#fff;overflow:hidden;margin-bottom:1.8rem;box-shadow:0 2px 12px rgba(18,66,197,.05);}
    .stat{flex:1;text-align:center;padding:1.1rem .5rem;border-right:1px solid var(--border);}
    .stat:last-child{border-right:0;}
    .stat strong{display:block;font-size:1.6rem;font-weight:900;letter-spacing:-.05em;color:var(--blue);}
    .stat span{font-size:.68rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:.15rem;display:block;}

    /* SECTION */
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;}
    .section-head h2{font-size:1.1rem;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:.5rem;}
    .section-head span{font-size:.76rem;color:var(--muted);font-weight:700;background:#f1f5f9;border:1px solid var(--border);padding:.2rem .65rem;border-radius:999px;}

    /* EVENT GRID — poster style */
    .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;padding-bottom:3rem;}
    .ev-card{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 4px 20px rgba(18,66,197,.07);transition:transform .2s,box-shadow .2s;cursor:pointer;}
    .ev-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(18,66,197,.14);}
    .ev-cover{aspect-ratio:4/5;position:relative;overflow:hidden;background:linear-gradient(135deg,#1242c5,#2f6bff);}
    .ev-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .ev-cover-placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:2.8rem;}
    .ev-status{position:absolute;top:.65rem;left:.65rem;font-size:.65rem;font-weight:900;padding:.22rem .65rem;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;backdrop-filter:blur(6px);}
    .ev-status.live{background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;}
    .ev-status.draft{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#fcd34d;}
    .ev-body{padding:.9rem 1rem 1rem;}
    .ev-poster-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
    .ev-date{font-size:.7rem;font-weight:800;color:#8b2cff;text-transform:uppercase;letter-spacing:.06em;}
    .ev-city{font-size:.7rem;font-weight:700;color:var(--muted);}
    .ev-name{font-size:1rem;font-weight:900;letter-spacing:-.03em;color:var(--text);margin-bottom:.3rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
    .ev-loc{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;margin-bottom:.6rem;}
    .ev-footer{display:flex;align-items:center;justify-content:space-between;}
    .ev-price{font-size:.88rem;font-weight:900;color:var(--text);}
    .ev-price strong{color:#8b2cff;font-size:.95rem;}
    .ev-cta{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;border:0;border-radius:10px;padding:.42rem .85rem;font-size:.76rem;font-weight:800;box-shadow:0 4px 14px rgba(18,66,197,.25);transition:transform .15s;}
    .ev-cta:hover{transform:translateY(-1px);}

    /* EMPTY */
    .empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);grid-column:1/-1;}
    .empty-icon{font-size:2.8rem;margin-bottom:.75rem;}
    .empty strong{display:block;font-size:1rem;font-weight:800;color:var(--text);margin-bottom:.3rem;}

    /* TOAST */
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:.65rem 1.25rem;border-radius:12px;font-size:.82rem;font-weight:700;opacity:0;transition:all .3s;z-index:99;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

    /* SKEL */
    .skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    @media(max-width:700px){.profile-head{flex-direction:column;align-items:flex-start;}.profile-actions{width:100%;margin-left:0;}.stats-row{flex-wrap:wrap;}.stat{min-width:33%;}.events-grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:420px){.events-grid{grid-template-columns:1fr;}}
  </style>
</head>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBCgNQy8EJLg7E-SA1cMePGetWLOR7WWMI",
  authDomain: "ogshootsluxe-36740.firebaseapp.com",
  projectId: "ogshootsluxe-36740",
  storageBucket: "ogshootsluxe-36740.firebasestorage.app",
  messagingSenderId: "5471814825",
  appId: "1:5471814825:web:07e84f2f88486da817d5b8"
});
const db = firebase.firestore();
const auth = firebase.auth();

async function getCurrentUser() {
  return new Promise(resolve => {
    const unsub = auth.onAuthStateChanged(async firebaseUser => {
      unsub();
      if (!firebaseUser) { resolve(null); return; }
      try {
        const snap = await db.collection('users').doc(firebaseUser.uid).get();
        const data = snap.exists ? snap.data() : {};
        resolve({ uid: firebaseUser.uid, email: firebaseUser.email, name: data.name || firebaseUser.displayName || firebaseUser.email, role: data.role || 'client' });
      } catch { resolve({ uid: firebaseUser.uid, email: firebaseUser.email, name: firebaseUser.displayName || firebaseUser.email, role: 'client' }); }
    });
  });
}

const params = new URLSearchParams(location.search);
const targetUid = params.get('uid');
let isOwner = false;
let profileData = {};
let isFollowing = false;

function toggleFollow(){
  const btn = document.getElementById('followBtn');
  if(!btn) return;
  isFollowing = !isFollowing;
  btn.textContent = isFollowing ? '✔️ Following' : '❤️ Follow';
  btn.className = isFollowing ? 'btn btn-ghost' : 'btn btn-primary';
  const el = document.getElementById('statFollowers');
  const cur = parseInt((el.textContent||'0').replace(/,/g,''))||0;
  el.textContent = (isFollowing ? cur+1 : Math.max(0,cur-1)).toLocaleString('en-IN');
  showToast(isFollowing ? 'You are now following!' : 'Unfollowed');
}

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

function fmtPrice(p){
  if(!p || p==0) return '<span class="ev-price">Free</span>';
  return `<span class="ev-price">₹${Number(p).toLocaleString('en-IN')}<small> onwards</small></span>`;
}

function statusBadge(s){
  const norm = (s||'draft').toLowerCase();
  if(norm==='published') return '<span class="ev-status live">Live</span>';
  return '<span class="ev-status draft">Draft</span>';
}

const COVER_GRADIENTS = [
  'linear-gradient(135deg,#0a0f1e,#1242c5,#2f6bff)',
  'linear-gradient(135deg,#7c3aed,#c084fc)',
  'linear-gradient(135deg,#0891b2,#67e8f9)',
  'linear-gradient(135deg,#0d9488,#5eead4)',
  'linear-gradient(135deg,#dc2626,#f97316)',
  'linear-gradient(135deg,#92400e,#fbbf24)',
];

function renderEvents(events){
  const grid = document.getElementById('eventsGrid');
  grid.innerHTML = '';
  const total = events.length;
  const live = events.filter(e=>(e.status||'').toLowerCase()==='published').length;
  document.getElementById('statEvents').textContent = total;
  document.getElementById('statLive').textContent = live;
  document.getElementById('statTotal').textContent = events.reduce((s,e)=>s+Number(e.totalBookings||0),0).toLocaleString('en-IN');
  document.getElementById('eventsSubtitle').textContent = total + ' listing' + (total!==1?'s':'');

  if(!total){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🎪</div><strong>No events yet</strong><span>This organiser hasn't published any events.</span></div>`;
    return;
  }

  const GRADS = [
    'linear-gradient(135deg,#1242c5,#2f6bff)',
    'linear-gradient(135deg,#7c3aed,#c084fc)',
    'linear-gradient(135deg,#0891b2,#67e8f9)',
    'linear-gradient(135deg,#0d9488,#5eead4)',
    'linear-gradient(135deg,#dc2626,#f97316)',
  ];

  grid.innerHTML = events.map((ev,i)=>{
    const grad = GRADS[i%GRADS.length];
    const cover = ev.cardImgUrl||ev.coverUrl;
    const price = ev.tickets?.[0]?.price||ev.price||0;
    const priceStr = price ? `<strong>₹${Number(price).toLocaleString('en-IN')}</strong> <span style="font-size:.72rem;color:var(--muted);">/ onward</span>` : '<strong style="color:#10b981;">Free</strong>';
    let dateLabel = '';
    if(ev.startDate){
      try{
        const d = ev.startDate.toDate ? ev.startDate.toDate() : new Date(String(ev.startDate).slice(0,10)+'T00:00:00');
        dateLabel = d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
      }catch(e){}
    }
    const norm = (ev.status||'draft').toLowerCase();
    const statusBadge = norm==='published' ? `<span class="ev-status live">LIVE</span>` : '';
    return `
    <div class="ev-card" onclick="location.href='event-detail.html?eventId=${ev.id}'">
      <div class="ev-cover" style="background:${grad};">
        ${cover ? `<img src="${esc(cover)}" alt="${esc(ev.name)}" loading="lazy"/>` : `<div class="ev-cover-placeholder">🎉</div>`}
        ${statusBadge}
      </div>
      <div class="ev-body">
        <div class="ev-poster-info">
          <span class="ev-date">📅 ${dateLabel||'TBA'}</span>
          <span class="ev-city">${esc(ev.city||'')}</span>
        </div>
        <div class="ev-name">${esc(ev.name||'Untitled Event')}</div>
        <div class="ev-loc">📍 ${esc(ev.venueName||ev.city||'Venue TBA')}</div>
        <div class="ev-footer">
          <div class="ev-price">${priceStr}</div>
          <button class="ev-cta" onclick="event.stopPropagation();location.href='event-detail.html?eventId=${ev.id}'">View →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderProfile(data){
  profileData = data;
  const initials = (data.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const avatarEl = document.getElementById('profileAvatar');
  if(data.avatarUrl){
    avatarEl.innerHTML = `<img src="${esc(data.avatarUrl)}" alt="avatar"/>`;
  } else {
    avatarEl.textContent = initials;
  }

  // banner cover
  const bannerEl = document.getElementById('bannerEl');
  if(data.bannerUrl) bannerEl.innerHTML += `<img class="banner-img" src="${esc(data.bannerUrl)}" alt="banner"/>`;

  document.getElementById('profileName').textContent = data.name||'Organiser';
  document.getElementById('profileHandle').textContent = '@'+(data.handle||data.uid?.slice(0,8)||'organiser');
  document.getElementById('profileBio').textContent = data.bio||'';
  document.getElementById('statFollowers').textContent = (data.followers||0).toLocaleString('en-IN');
  document.title = `${data.name||'Organiser'} | CultureWave`;

  // badges
  if(data.verified) document.getElementById('verifiedBadge').style.display='';
  if(data.plan==='premium'||data.plan==='growth') document.getElementById('premiumBadge').style.display='';

  // socials
  const socials = [];
  if(data.instagram) socials.push(`<a class="social-chip" href="https://instagram.com/${data.instagram}" target="_blank">📸 @${data.instagram}</a>`);
  if(data.twitter)   socials.push(`<a class="social-chip" href="https://twitter.com/${data.twitter}" target="_blank">🐦 @${data.twitter}</a>`);
  if(data.website)   socials.push(`<a class="social-chip" href="${esc(data.website)}" target="_blank">🌐 Website</a>`);
  document.getElementById('profileSocials').innerHTML = socials.join('');

  if(isOwner){
    document.getElementById('bannerEditBtn').style.display='none';
  }
  // Always show Follow + Share for public view
  document.getElementById('profileActions').innerHTML = `
    <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">❤️ Follow</button>
    <button class="btn btn-ghost" onclick="shareProfile()">🔗 Share</button>`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function shareProfile(){
  const url = location.href;
  navigator.clipboard.writeText(url).then(()=>showToast('Profile link copied!')).catch(()=>showToast(url));
}

async function init(){
  // check if logged-in user is the owner
  let myUid = null;
  try{
    const user = await getCurrentUser();
    if(user){ myUid = user.uid; }
  }catch(e){}

  const uid = targetUid || myUid;
  if(!uid){
    document.getElementById('profileName').textContent = 'Sign in to view your profile';
    document.getElementById('profileHandle').textContent = '';
    document.getElementById('eventsGrid').innerHTML = `<div class="empty"><div class="empty-icon">🔒</div><strong>Not signed in</strong><a href="login.html" style="color:var(--blue);font-weight:700;">Login to view your profile</a></div>`;
    return;
  }
  isOwner = !!(myUid && myUid === uid);

  // load organiser profile doc
  const profSnap = await db.collection('organisers').doc(uid).get();
  if(profSnap.exists) renderProfile({uid, ...profSnap.data()});
  else {
    // fallback to users collection
    const userSnap = await db.collection('users').doc(uid).get();
    renderProfile({uid, ...(userSnap.exists ? userSnap.data() : { name: 'Organiser' })});
  }

  // load their published events (+ drafts if owner)
  let q = db.collection('events').where('ownerId','==',uid).limit(50);
  const snap = await q.get();
  const events = snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(e=>(e.status||'').toLowerCase()==='published');
  renderEvents(events);
}

init();
</script>
<script>
  const ham = document.getElementById('hamburger');
  const mNav = document.getElementById('mobileNav');
  if(ham) ham.addEventListener('click', () => {
    ham.classList.toggle('open');
    mNav.classList.toggle('open');
    document.body.style.overflow = mNav.classList.contains('open') ? 'hidden' : '';
  });
  if(mNav) mNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    ham.classList.remove('open'); mNav.classList.remove('open'); document.body.style.overflow = '';
  }));
</script>
</body>
</html>
