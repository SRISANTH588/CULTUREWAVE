<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CultureWave | Organiser Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    :root{--blue:#1242c5;--blue-2:#2f6bff;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--border:#dce4f5;--muted:#64748b;--text:#0a0f1e;}
    body{background:#f0f4ff;font-size:14px;min-height:100vh;}
    *{box-sizing:border-box;margin:0;padding:0;}
    a{text-decoration:none;color:inherit;}
    button{font:inherit;cursor:pointer;}

    /* BANNER */
    .banner{height:260px;background:linear-gradient(135deg,#0a0f1e 0%,#1242c5 55%,#2f6bff 100%);position:relative;overflow:hidden;}
    .banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,15,30,.1) 0%,rgba(10,15,30,.55) 100%);}
    .banner-edit{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:.4rem .9rem;font-size:.76rem;font-weight:800;backdrop-filter:blur(8px);display:none;cursor:pointer;z-index:2;}

    /* PROFILE CARD */
    .profile-wrap{max-width:860px;margin:0 auto;padding:0 1.2rem 3rem;}
    .profile-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:1.5rem;margin-top:-48px;position:relative;z-index:2;box-shadow:0 8px 40px rgba(18,66,197,.1);}
    .profile-top{display:flex;align-items:flex-end;gap:1.2rem;margin-bottom:1rem;flex-wrap:wrap;}
    .avatar{width:96px;height:96px;border-radius:22px;border:4px solid #fff;background:linear-gradient(135deg,var(--blue),var(--blue-2));display:grid;place-items:center;font-size:2rem;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 24px rgba(18,66,197,.25);overflow:hidden;margin-top:-64px;}
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .profile-info{flex:1;min-width:0;}
    .profile-name-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem;}
    .profile-name{font-size:1.5rem;font-weight:900;letter-spacing:-.04em;color:var(--text);}
    .verified-badge{display:inline-flex;align-items:center;gap:.25rem;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;font-size:.62rem;font-weight:900;padding:.2rem .55rem;border-radius:999px;letter-spacing:.06em;}
    .premium-badge{display:inline-flex;align-items:center;gap:.25rem;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-size:.62rem;font-weight:900;padding:.2rem .55rem;border-radius:999px;letter-spacing:.06em;}
    .profile-handle{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:.35rem;}
    .profile-bio{font-size:.88rem;color:#475569;line-height:1.65;margin-bottom:.6rem;}
    .socials{display:flex;gap:.4rem;flex-wrap:wrap;}
    .social-chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border-radius:999px;background:#f1f5f9;border:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--muted);transition:all .2s;}
    .social-chip:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
    .profile-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.75rem;}
    .btn{border:0;border-radius:12px;padding:.55rem 1.1rem;font-weight:800;font-size:.82rem;display:inline-flex;align-items:center;gap:.4rem;transition:transform .15s,box-shadow .15s;cursor:pointer;}
    .btn-primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 6px 18px rgba(18,66,197,.28);}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(18,66,197,.38);}
    .btn-ghost{background:#fff;color:var(--text);border:1.5px solid var(--border);}
    .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}

    /* STATS */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:18px;background:#fff;overflow:hidden;margin:1.2rem 0;box-shadow:0 2px 12px rgba(18,66,197,.05);}
    .stat{text-align:center;padding:1rem .5rem;border-right:1px solid var(--border);}
    .stat:last-child{border-right:0;}
    .stat strong{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.05em;color:var(--blue);}
    .stat span{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:.1rem;display:block;}

    /* EVENTS SECTION */
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
    .section-head h2{font-size:1rem;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:.4rem;}
    .section-head .count{font-size:.72rem;color:var(--muted);font-weight:700;background:#f1f5f9;border:1px solid var(--border);padding:.18rem .6rem;border-radius:999px;}

    /* EVENT GRID */
    .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;padding-bottom:2rem;}
    .ev-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(18,66,197,.07);transition:transform .2s,box-shadow .2s;cursor:pointer;}
    .ev-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(18,66,197,.13);}
    .ev-cover{aspect-ratio:3/4;position:relative;overflow:hidden;background:linear-gradient(135deg,#1242c5,#2f6bff);}
    .ev-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .ev-cover-placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:2.5rem;}
    .ev-status{position:absolute;top:.6rem;left:.6rem;font-size:.62rem;font-weight:900;padding:.2rem .6rem;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;backdrop-filter:blur(6px);}
    .ev-status.live{background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;}
    .ev-status.draft{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#fcd34d;}
    .ev-body{padding:.85rem .9rem .9rem;}
    .ev-date{font-size:.68rem;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;}
    .ev-name{font-size:.95rem;font-weight:900;letter-spacing:-.02em;color:var(--text);margin-bottom:.25rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .ev-loc{font-size:.72rem;color:var(--muted);margin-bottom:.6rem;display:flex;align-items:center;gap:.25rem;}
    .ev-footer{display:flex;align-items:center;justify-content:space-between;}
    .ev-price{font-size:.85rem;font-weight:900;color:var(--text);}
    .ev-price strong{color:var(--blue);}
    .ev-cta{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;border:0;border-radius:9px;padding:.38rem .8rem;font-size:.72rem;font-weight:800;box-shadow:0 4px 12px rgba(18,66,197,.22);}

    /* EMPTY */
    .empty{text-align:center;padding:3rem 1rem;color:var(--muted);grid-column:1/-1;}
    .empty-icon{font-size:2.5rem;margin-bottom:.6rem;}
    .empty strong{display:block;font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:.25rem;}

    /* TOAST */
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:.65rem 1.25rem;border-radius:12px;font-size:.82rem;font-weight:700;opacity:0;transition:all .3s;z-index:99;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

    /* SKEL */
    .skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    @media(max-width:600px){
      .banner{height:180px;}
      .avatar{width:80px;height:80px;border-radius:18px;font-size:1.6rem;margin-top:-52px;}
      .profile-name{font-size:1.25rem;}
      .stats-row{grid-template-columns:repeat(2,1fr);}
      .stat:nth-child(2){border-right:0;}
      .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--border);}
      .events-grid{grid-template-columns:repeat(2,1fr);}
      .profile-card{padding:1rem;}
    }
    @media(max-width:380px){.events-grid{grid-template-columns:1fr;}}
  </style>
</head>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBCgNQy8EJLg7E-SA1cMePGetWLOR7WWMI",
  authDomain: "ogshootsluxe-36740.firebaseapp.com",
  projectId: "ogshootsluxe-36740",
  storageBucket: "ogshootsluxe-36740.firebasestorage.app",
  messagingSenderId: "5471814825",
  appId: "1:5471814825:web:07e84f2f88486da817d5b8"
});
const db = firebase.firestore();
const auth = firebase.auth();

async function getCurrentUser() {
  return new Promise(resolve => {
    const unsub = auth.onAuthStateChanged(async firebaseUser => {
      unsub();
      if (!firebaseUser) { resolve(null); return; }
      try {
        const snap = await db.collection('users').doc(firebaseUser.uid).get();
        const data = snap.exists ? snap.data() : {};
        resolve({ uid: firebaseUser.uid, email: firebaseUser.email, name: data.name || firebaseUser.displayName || firebaseUser.email, role: data.role || 'client' });
      } catch { resolve({ uid: firebaseUser.uid, email: firebaseUser.email, name: firebaseUser.displayName || firebaseUser.email, role: 'client' }); }
    });
  });
}

const params = new URLSearchParams(location.search);
const targetUid = params.get('uid');
let isOwner = false;
let profileData = {};
let isFollowing = false;

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function shareProfile(){
  navigator.clipboard.writeText(location.href).then(()=>showToast('Profile link copied!')).catch(()=>showToast(location.href));
}

function toggleFollow(){
  const btn = document.getElementById('followBtn');
  if(!btn) return;
  isFollowing = !isFollowing;
  btn.textContent = isFollowing ? '✔️ Following' : '❤️ Follow';
  btn.className = isFollowing ? 'btn btn-ghost' : 'btn btn-primary';
  const el = document.getElementById('statFollowers');
  const cur = parseInt((el.textContent||'0').replace(/,/g,''))||0;
  el.textContent = (isFollowing ? cur+1 : Math.max(0,cur-1)).toLocaleString('en-IN');
  showToast(isFollowing ? 'You are now following!' : 'Unfollowed');
}

function renderEvents(events){
  const grid = document.getElementById('eventsGrid');
  grid.innerHTML = '';
  const total = events.length;
  const live = events.filter(e=>(e.status||'').toLowerCase()==='published').length;
  document.getElementById('statEvents').textContent = total;
  document.getElementById('statLive').textContent = live;
  document.getElementById('statTotal').textContent = events.reduce((s,e)=>s+Number(e.totalBookings||0),0).toLocaleString('en-IN');
  document.getElementById('eventsSubtitle').textContent = total + ' listing' + (total!==1?'s':'');

  if(!total){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🎪</div><strong>No events yet</strong><span>This organiser hasn't published any events.</span></div>`;
    return;
  }

  const GRADS = [
    'linear-gradient(135deg,#1242c5,#2f6bff)',
    'linear-gradient(135deg,#7c3aed,#c084fc)',
    'linear-gradient(135deg,#0891b2,#67e8f9)',
    'linear-gradient(135deg,#0d9488,#5eead4)',
    'linear-gradient(135deg,#dc2626,#f97316)',
  ];

  grid.innerHTML = events.map((ev,i)=>{
    const grad = GRADS[i%GRADS.length];
    const cover = ev.cardImgUrl||ev.coverUrl;
    const price = ev.tickets?.[0]?.price||ev.price||0;
    const priceStr = price ? `<strong>₹${Number(price).toLocaleString('en-IN')}</strong> <span style="font-size:.68rem;color:var(--muted);">onwards</span>` : '<strong style="color:#10b981;">Free</strong>';
    let dateLabel = '';
    if(ev.startDate){
      try{
        const d = ev.startDate.toDate ? ev.startDate.toDate() : new Date(String(ev.startDate).slice(0,10)+'T00:00:00');
        dateLabel = d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
      }catch(e){}
    }
    const norm = (ev.status||'draft').toLowerCase();
    const badge = norm==='published' ? `<span class="ev-status live">LIVE</span>` : '';
    return `
    <div class="ev-card" onclick="location.href='event-detail.html?eventId=${ev.id}'">
      <div class="ev-cover" style="background:${grad};">
        ${cover ? `<img src="${cover}" alt="${esc(ev.name)}" loading="lazy"/>` : `<div class="ev-cover-placeholder">🎉</div>`}
        ${badge}
      </div>
      <div class="ev-body">
        <div class="ev-date">📅 ${dateLabel||'TBA'}</div>
        <div class="ev-name">${esc(ev.name||'Untitled Event')}</div>
        <div class="ev-loc">📍 ${esc(ev.venueName||ev.city||'Venue TBA')}</div>
        <div class="ev-footer">
          <div class="ev-price">${priceStr}</div>
          <button class="ev-cta" onclick="event.stopPropagation();location.href='event-detail.html?eventId=${ev.id}'">View →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderProfile(data){
  profileData = data;
  const initials = (data.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const avatarEl = document.getElementById('profileAvatar');
  if(data.avatarUrl){
    avatarEl.innerHTML = `<img src="${data.avatarUrl}" alt="avatar"/>`;
  } else {
    avatarEl.textContent = initials;
  }

  // banner
  const bannerEl = document.getElementById('bannerEl');
  const bannerSrc = data.bannerUrl || data.coverUrl || '';
  if(bannerSrc){
    const img = document.createElement('img');
    img.className = 'banner-img';
    img.src = bannerSrc;
    img.alt = 'banner';
    bannerEl.insertBefore(img, bannerEl.firstChild);
  }

  document.getElementById('profileName').textContent = data.name||'Organiser';
  document.getElementById('profileHandle').textContent = '@'+(data.handle||data.uid?.slice(0,8)||'organiser');
  document.getElementById('profileBio').textContent = data.bio||'';
  document.getElementById('statFollowers').textContent = (data.followers||0).toLocaleString('en-IN');
  document.title = `${data.name||'Organiser'} | CultureWave`;

  if(data.verified) document.getElementById('verifiedBadge').style.display='';
  if(data.plan==='premium'||data.plan==='growth') document.getElementById('premiumBadge').style.display='';

  const socials = [];
  if(data.instagram) socials.push(`<a class="social-chip" href="https://instagram.com/${data.instagram}" target="_blank">📸 @${data.instagram}</a>`);
  if(data.twitter)   socials.push(`<a class="social-chip" href="https://twitter.com/${data.twitter}" target="_blank">🐦 @${data.twitter}</a>`);
  if(data.youtube)   socials.push(`<a class="social-chip" href="https://youtube.com/@${data.youtube}" target="_blank">▶️ YouTube</a>`);
  if(data.website)   socials.push(`<a class="social-chip" href="${data.website}" target="_blank">🌐 Website</a>`);
  document.getElementById('profileSocials').innerHTML = socials.join('');

  if(isOwner){
    document.getElementById('bannerEditBtn').style.display='block';
    document.getElementById('profileActions').innerHTML = `
      <a href="premium-client-dashboard.html"><button class="btn btn-primary">✏️ Edit Profile</button></a>
      <button class="btn btn-ghost" onclick="shareProfile()">🔗 Share</button>`;
  } else {
    document.getElementById('profileActions').innerHTML = `
      <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">❤️ Follow</button>
      <button class="btn btn-ghost" onclick="shareProfile()">🔗 Share</button>`;
  }
}

async function init(){
  let myUid = null;
  try{ const user = await getCurrentUser(); if(user) myUid = user.uid; }catch(e){}

  const uid = targetUid || myUid;
  if(!uid){
    document.getElementById('profileName').textContent = 'Sign in to view your profile';
    document.getElementById('profileHandle').textContent = '';
    document.getElementById('eventsGrid').innerHTML = `<div class="empty"><div class="empty-icon">🔒</div><strong>Not signed in</strong><a href="login.html" style="color:var(--blue);font-weight:700;">Login to view your profile</a></div>`;
    return;
  }
  isOwner = !!(myUid && myUid === uid);

  const profSnap = await db.collection('organisers').doc(uid).get();
  if(profSnap.exists) renderProfile({uid, ...profSnap.data()});
  else {
    const userSnap = await db.collection('users').doc(uid).get();
    renderProfile({uid, ...(userSnap.exists ? userSnap.data() : { name: 'Organiser' })});
  }

  const snap = await db.collection('events').where('ownerId','==',uid).limit(50).get();
  const events = snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(e=>(e.status||'').toLowerCase()==='published');
  renderEvents(events);
}

init();
</script>
<script>
  const ham = document.getElementById('hamburger');
  const mNav = document.getElementById('mobileNav');
  if(ham) ham.addEventListener('click', () => {
    ham.classList.toggle('open');
    mNav.classList.toggle('open');
    document.body.style.overflow = mNav.classList.contains('open') ? 'hidden' : '';
  });
  if(mNav) mNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    ham.classList.remove('open'); mNav.classList.remove('open'); document.body.style.overflow = '';
  }));
</script>
</body>
</html>
