<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Activate CultureWave Lister Account</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f7ff;color:#172033;font:16px system-ui,-apple-system,sans-serif}.card{width:min(560px,100%);padding:clamp(24px,6vw,44px);background:#fff;border:1px solid #dce5f8;border-radius:22px;box-shadow:0 24px 70px #14388316}h1{margin:12px 0;font-size:clamp(1.6rem,5vw,2.1rem)}p{line-height:1.6;color:#64748b}.brand{color:#2457d6;font-size:1.15rem;font-weight:850}.field{display:grid;gap:7px;margin:20px 0}.field input{padding:13px;border:1px solid #d6deec;border-radius:10px;font:inherit}.button{width:100%;padding:14px;border:0;border-radius:11px;background:#2457d6;color:#fff;font:700 1rem system-ui;cursor:pointer}.button.secondary{margin-top:10px;background:#edf2ff;color:#2457d6}.button:disabled{opacity:.6}.status{display:none;margin-top:16px;padding:13px;border-radius:10px;background:#fff1f0;color:#a5261c;line-height:1.5}.status.show{display:block}.status.ok{background:#ecfdf3;color:#17603a}
  </style>
</head>
<body>
  <main class="card"><div class="brand">CultureWave</div><h1>Activate your lister account</h1><p>Use the email address that received this approval link. Create a password to set up your lister account.</p><label class="field">Email address<input id="email" type="email" autocomplete="email" required></label><label class="field">Create a password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label class="field">Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button id="activate" class="button" type="button">Create account and activate</button><button id="resetPassword" class="button secondary" type="button" hidden>Reset existing account password</button><div id="status" class="status" role="status" aria-live="polite"></div></main>
  <script type="module">
    import { auth, db } from './firebase.js';
    import { createUserWithEmailAndPassword, sendPasswordResetEmail, signInAnonymously, signInWithEmailAndPassword, reload } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { doc, getDoc, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    const paramsFromLink=(()=>{const queue=[location.href],seen=new Set(),state={};while(queue.length&&seen.size<12){const raw=queue.shift();if(!raw||seen.has(raw))continue;seen.add(raw);try{const url=new URL(raw,location.origin);for(const key of ['activation','applicationId'])if(!state[key]&&url.searchParams.has(key))state[key]=url.searchParams.get(key);for(const key of ['continueUrl','continueURL','link','deep_link_id']){const nested=url.searchParams.get(key);if(nested)queue.push(nested)}}catch{}}return state})();
    const emailInput=document.getElementById('email'),button=document.getElementById('activate'),resetButton=document.getElementById('resetPassword'),status=document.getElementById('status');
    const dashboardByCategory={nightlife:'dashboard-nightlife.html',brunch:'dashboard-brunch.html',dining:'dashboard-restaurant.html',workshops:'dashboard-workshops.html',experiences:'dashboard-experiences.html',music:'dashboard-livemusic.html'};
    const allowedDashboards=new Set([...Object.values(dashboardByCategory),'premium-client-dashboard.html']);
    const normalizeCategory=value=>{const key=String(value||'').trim().toLowerCase();const aliases={'party':'nightlife','parties':'nightlife','fine dining':'dining','restaurant':'dining','live music':'music','experience':'experiences'};return aliases[key]||key};
    const say=(message,ok=false)=>{status.textContent=message;status.className='status show'+(ok?' ok':'')};
    emailInput.value='';
    async function hashToken(value){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return Array.from(new Uint8Array(bytes),byte=>byte.toString(16).padStart(2,'0')).join('')}
    async function activate(uid,email,emailVerified){
      const rawToken=paramsFromLink.activation;if(!rawToken)throw new Error('This activation link is missing its approval token. Ask CultureWave to send a new activation email.');
      const tokenHash=await hashToken(rawToken),tokenRef=doc(db,'onboardingActivationTokens',tokenHash);
      let step='reading the approval link';
      try{
        const tokenSnapshot=await getDoc(tokenRef);if(!tokenSnapshot.exists())throw new Error('This activation link is invalid or expired. Ask CultureWave to send a new one.');
        const token=tokenSnapshot.data(),expiresAt=token.expiresAt?.toDate?.()||new Date(token.expiresAt);
        if(String(token.email||'').trim().toLowerCase()!==email.trim().toLowerCase())throw new Error('This activation link belongs to a different email address. Use the approved email shown in the link.');
        if(token.used){if(token.activatedBy===uid)return;throw new Error('This activation link has already been used. Contact CultureWave if you need help.')}
        if(expiresAt.getTime()<Date.now())throw new Error('This activation link has expired. Ask CultureWave to send a new one.');
        const userRef=doc(db,'users',uid),organiserRef=doc(db,'organisers',uid),applicationRef=doc(db,'vendorOnboarding',token.applicationId),userSnapshot=await getDoc(userRef);
        if(userSnapshot.exists()&&!['client','customer','lister'].includes(userSnapshot.data().role))throw new Error('This email already has a different account type. Contact CultureWave support.');
        const category=normalizeCategory(token.preferredCategory),dashboard=dashboardByCategory[category]||(allowedDashboards.has(token.preferredDashboard)?token.preferredDashboard:'premium-client-dashboard.html');
        const profile={uid,name:token.name||email,email,phone:token.phone||'',role:'lister',dashboard,preferredCategory:category||'',status:'active',emailVerified:emailVerified===true,onboardingApplicationId:token.applicationId,activationTokenHash:tokenHash};
        step='saving your lister profile';
        await setDoc(userRef,{...(userSnapshot.exists()?userSnapshot.data():{}),...profile,...(userSnapshot.exists()?{updatedAt:serverTimestamp()}:{createdAt:serverTimestamp()})},{merge:true});
        step='saving your organiser profile';
        await setDoc(organiserRef,{ownerId:uid,name:token.businessName||token.name||email,businessName:token.businessName||'',email,phone:token.phone||'',status:'active',createdAt:serverTimestamp()},{merge:true});
        step='activating your approved application';
        await updateDoc(applicationRef,{userId:uid,accountSetupStatus:'ACTIVE',updatedAt:serverTimestamp()});
        step='completing your approval link';
        await updateDoc(tokenRef,{used:true,activatedBy:uid,activatedAt:serverTimestamp()});
      }catch(error){
        if(error.code==='permission-denied')throw new Error(`Permission was denied while ${step}. Reload this page and try again; if it repeats, ask CultureWave to resend the approval link.`);
        throw error;
      }
    }
    async function completeActivation(user,email){
      await reload(user);
      await user.getIdToken(true);
      await activate(user.uid,user.email||email,user.emailVerified);
      const userSnapshot=await getDoc(doc(db,'users',user.uid)),profile=userSnapshot.exists()?userSnapshot.data():{},destination=allowedDashboards.has(profile.dashboard)?profile.dashboard:dashboardByCategory[normalizeCategory(profile.preferredCategory)]||'premium-client-dashboard.html';
      say('Your lister account is active. Opening your dashboard…',true);button.textContent='Account activated';setTimeout(()=>location.assign(destination),900);
    }
    auth.authStateReady().then(()=>{const user=auth.currentUser;if(user?.email)emailInput.value=user.email}).catch(error=>console.error('Could not restore the sign-in session:',error));
    button.addEventListener('click',async()=>{
      let email=emailInput.value.trim().toLowerCase();const password=document.getElementById('password').value,confirmPassword=document.getElementById('confirmPassword').value;if(!email){say('Enter the email address that received this link.');return}if(password.length<8){say('Choose a password with at least 8 characters.');return}if(password!==confirmPassword){say('The passwords do not match.');return}
      button.disabled=true;button.textContent='Creating account…';
      try{
        let session=auth.currentUser;if(!session)session=(await signInAnonymously(auth)).user;
        const rawToken=paramsFromLink.activation;if(!rawToken)throw new Error('This activation link is missing its approval token. Ask CultureWave to send a new activation email.');
        const tokenSnapshot=await getDoc(doc(db,'onboardingActivationTokens',await hashToken(rawToken)));if(!tokenSnapshot.exists())throw new Error('This activation link is invalid or expired. Ask CultureWave to send a new one.');
        const approvedEmail=String(tokenSnapshot.data().email||'').trim().toLowerCase();if(!approvedEmail)throw new Error('The approved email is missing from this activation link. Ask CultureWave to resend it.');
        if(email!==approvedEmail){email=approvedEmail;emailInput.value=approvedEmail}
        let user=auth.currentUser?.email?.toLowerCase()===email?auth.currentUser:null;if(!user){try{user=(await signInWithEmailAndPassword(auth,email,password)).user}catch(error){if(error.code!=='auth/user-not-found'&&error.code!=='auth/invalid-credential')throw error;user=(await createUserWithEmailAndPassword(auth,email,password)).user}}
        await reload(user);await completeActivation(user,email)
      }catch(error){if(error.code==='auth/email-already-in-use'){resetButton.hidden=false;say('This approved email already has an account. Enter the password you previously set, or reset it below.')}else say(error.code==='auth/operation-not-allowed'?'Enable Email/Password in Firebase Authentication → Sign-in method, then try again.':error.message||'We could not activate this account. Ask CultureWave to resend the link.');button.disabled=false;button.textContent='Create account and activate'}
    });
    resetButton.addEventListener('click',async()=>{
      const email=emailInput.value.trim().toLowerCase();if(!email){say('Enter the approved email address first.');return}
      resetButton.disabled=true;resetButton.textContent='Sending reset link…';
      try{await sendPasswordResetEmail(auth,email,{url:location.href,handleCodeInApp:false});say(`Password reset email sent to ${email}. Reset the password, return to this activation page, then activate your account.`,true)}catch(error){say(error.message||'Could not send a password reset email.');resetButton.disabled=false;resetButton.textContent='Reset existing account password'}
    });
  </script>
</body>
</html>
