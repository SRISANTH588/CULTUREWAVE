*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#5b173c,transparent 34%),#0e0d12;color:#fff;font-family:Inter,system-ui,sans-serif}.header{height:68px;padding:0 max(22px,6vw);display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;letter-spacing:-.04em;font-size:1.2rem}.header b{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;margin-right:9px;background:linear-gradient(135deg,#f23a79,#ab1355);font-size:.85rem}.header small{margin-left:auto;color:#ff9abb;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}.wrap{width:min(100% - 32px,720px);margin:0 auto;padding:48px 0 80px}.eyebrow{color:#ff9abb;text-transform:uppercase;letter-spacing:.15em;font-size:.68rem;font-weight:800}h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.07em;margin:12px 0 8px}.intro{margin:0 0 30px;color:#beb8c1;line-height:1.6}.playlist{padding:24px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(28,25,34,.8)}h2{margin:0;font-size:1.25rem}.description{margin:7px 0 18px;color:#aaa3ae;font-size:.88rem}.song{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:16px 0;border-top:1px solid rgba(255,255,255,.09)}.number{width:27px;height:27px;border-radius:50%;background:#312b38;color:#ff9abb;display:grid;place-items:center;font-size:.74rem}.song strong{font-size:.9rem;display:block}.song small{display:block;color:#aaa3ae;margin-top:4px;font-size:.78rem}.play{color:#ff9abb;text-decoration:none;font-size:.78rem;font-weight:800;padding-top:3px}.lyrics{grid-column:2/-1;margin:2px 0 0;border:1px solid #3e3543;border-radius:13px;background:#15131a;padding:13px 14px;color:#ddd6de;font-size:.83rem;line-height:1.65;white-space:pre-wrap}.lyrics summary{cursor:pointer;color:#ff9abb;font-weight:800}.lyrics p{margin:10px 0 0}.status{padding:30px;text-align:center;border:1px dashed rgba(255,255,255,.2);border-radius:18px;color:#aaa3ae}@m </style></head><body><header class="header"><b>CW</b>CultureWave <small>Event Playlist</small></header><main class="wrap"><div class="eyebrow">Listen together</div><h1>Tonight’s soundtrack.</h1><p class="intro">Explore the event playlist and read the lyrics without leaving this page.</p><section class="playlist"><div id="status" class="status">Loading playlist…</div><div id="content" hidden><h2 id="title"></h2><p class="description" id="description"></p><div id="songs"></div></div></section></main><script type=module src=./guest-playlist.js></script></body></html>
