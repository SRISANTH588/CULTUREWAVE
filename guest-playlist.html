<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CultureWave | Guest Playlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 18% 8%,#5d173b 0,transparent 32%),radial-gradient(circle at 88% 100%,#173b57 0,transparent 38%),#111015;display:grid;place-items:center;padding:24px}.card{width:min(100%,620px);padding:clamp(26px,6vw,48px);border:1px solid rgba(255,255,255,.14);border-radius:26px;background:rgba(25,23,30,.82);box-shadow:0 28px 80px rgba(0,0,0,.35);backdrop-filter:blur(16px)}.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#ffa5c2;font-weight:800}.icon{font-size:2.6rem;margin:18px 0 8px}h1{font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:-.055em;margin:0 0 10px}p{color:#c8c4cb;line-height:1.6;margin:0 0 24px}.phone-row{display:flex;gap:10px}.phone-row input{min-width:0;flex:1;padding:15px 16px;border-radius:12px;border:1px solid #5b5360;background:#100f13;color:#fff;font:inherit;outline:none}.phone-row input:focus{border-color:#ff5b95;box-shadow:0 0 0 3px rgba(255,91,149,.17)}button{padding:15px 19px;border:0;border-radius:12px;background:linear-gradient(135deg,#e11d58,#fb4d88);color:#fff;font:700 .9rem Inter;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.note,.status{font-size:.78rem;margin-top:12px}.note{color:#918b96}.status{min-height:20px;color:#ffafc9}.playlist{display:none;margin-top:28px}.playlist h2{font-size:1.15rem;margin:0 0 5px}.welcome{color:#8cf0bf;font-weight:700;margin-bottom:5px}.song{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}.song:last-child{border-bottom:0}.number{width:26px;height:26px;border-radius:50%;background:#302b35;display:grid;place-items:center;font-size:.75rem;color:#ffa5c2}.song strong{font-size:.88rem;display:block}.song small{color:#aaa3ae;display:block;margin-top:3px}.song a{margin-left:auto;color:#ff91b7;font-size:.78rem;font-weight:700;text-decoration:none}.empty{padding:18px;border:1px dashed rgba(255,255,255,.2);border-radius:12px;color:#c8c4cb;font-size:.88rem}@media(max-width:480px){.phone-row{flex-direction:column}.phone-row button{width:100%}}
  </style>
</head>
<body><main class="card"><div class="eyebrow">CultureWave guest access</div><div class="icon">🎶</div><h1>Your event soundtrack awaits.</h1><p>Enter the mobile number used for your booking to unlock the playlist.</p><form id="verifyForm"><div class="phone-row"><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="Mobile number" aria-label="Mobile number" required><button id="submit" type="submit">Verify &amp; continue</button></div></form><div class="status" id="status" role="status"></div><div class="note">We only use your number to confirm an active booking.</div><section class="playlist" id="playlist"><div class="welcome" id="welcome"></div><h2 id="playlistTitle"></h2><p id="playlistDescription"></p><div id="songs"></div></section></main><script>
const form=document.getElementById('verifyForm'),input=document.getElementById('phone'),status=document.getElementById('status'),submit=document.getElementById('submit');
const escapeHtml=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
form.addEventListener('submit',async e=>{e.preventDefault();const phone=input.value.replace(/\D/g,'');if(phone.length<10){status.textContent='Enter a valid mobile number.';return;}submit.disabled=true;status.textContent='Checking your booking…';try{const res=await fetch('/api/guest/playlist-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Verification failed.');status.textContent='Booking verified ✓';const list=data.playlist;document.getElementById('welcome').textContent=`Welcome, ${data.guestName}! You’re booked for ${data.eventName}.`;document.getElementById('playlistTitle').textContent=list?.title||'Playlist coming soon';document.getElementById('playlistDescription').textContent=list?.description||(!list?'Your organiser has not added a playlist yet.':'');const songs=document.getElementById('songs');songs.innerHTML=list?.songs?.length?list.songs.map((song,i)=>`<div class="song"><span class="number">${i+1}</span><div><strong>${escapeHtml(song.title)}</strong>${song.artist?`<small>${escapeHtml(song.artist)}</small>`:''}</div>${song.url?`<a href="${escapeHtml(song.url)}" target="_blank" rel="noopener">Play ↗</a>`:''}</div>`).join(''):'<div class="empty">No songs added yet. Please check back shortly.</div>';document.getElementById('playlist').style.display='block';form.style.display='none';}catch(err){status.textContent=err.message;}finally{submit.disabled=false;}});
</script></body></html>
