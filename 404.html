<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CultureWave</title>
</head>
<body>
  <p id="message" hidden></p>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const decodePart = value => { try { return decodeURIComponent(value || '').trim().toLowerCase(); } catch (_) { return ''; } };
    const slug = decodePart(parts[parts.length - 1]);
    const basePath = parts.length > 1 ? `/${parts.slice(0, -1).join('/')}/` : '/';
    const legacyEventDetailLink = parts.length === 1 && slug === 'event-detail' && new URLSearchParams(location.search).has('eventId');
    if (legacyEventDetailLink || (parts.length === 2 && /^[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?$/.test(slug))) {
      fetch('/event-detail.html')
        .then(response => {
          if (!response.ok) throw new Error('Event page could not be loaded.');
          return response.text();
        })
        .then(html => { document.open(); document.write(html); document.close(); })
        .catch(() => {
          document.title = 'Page not found | CultureWave';
          const message=document.getElementById('message');
          message.hidden=false;
          message.textContent = 'Event page could not be loaded.';
        });
    } else if (parts.length === 1 && /^[a-z0-9](?:[a-z0-9._-]{0,58}[a-z0-9])?$/.test(slug)) {
      const message=document.getElementById('message');
      message.hidden=false;
      message.textContent='Opening profile…';
      fetch(`${basePath}client-profile.html`)
        .then(response => {
          if (!response.ok) throw new Error('Profile page could not be loaded.');
          return response.text();
        })
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          document.title = 'Page not found | CultureWave';
          message.hidden=false;
          message.textContent = 'Profile page could not be loaded.';
        });
    } else {
      document.title = 'Page not found | CultureWave';
      document.getElementById('message').textContent = 'Page not found.';
    }
  </script>
</body>
</html>
