<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Buy Gift Card | CultureWave</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111;color:#f4f2f7;font-family:Inter,system-ui,sans-serif}.buy-page{min-height:100dvh;padding:0 1rem 7rem}.page-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.8rem;height:72px;margin:0 -1rem;padding:0 1rem;background:rgba(17,17,17,.96);backdrop-filter:blur(12px)}.back-btn,.history-btn{display:grid;place-items:center;height:46px;border:1px solid #37353d;border-radius:999px;background:#19181e;color:#fff;font:inherit}.back-btn{width:46px;font-size:1.8rem}.page-head h1{flex:1;margin:0;font-size:1rem;font-weight:700}.history-btn{padding:0 1rem;font-size:.85rem}.buy-hero{height:235px;position:relative;overflow:hidden;display:grid;place-items:center;margin:0 -1rem;background:radial-gradient(ellipse at 50% 0,#7b48ce 0,#381677 54%,#15131b 100%);text-align:center}.buy-hero:before,.buy-hero:after{content:'✦';position:absolute;color:#eee0ff;text-shadow:0 0 16px white}.buy-hero:before{left:19%;top:35%;font-size:1.2rem}.buy-hero:after{right:17%;bottom:24%;font-size:.8rem}.brand{position:relative;z-index:1}.brand-mark{font-size:1.65rem;font-weight:800;letter-spacing:-.035em}.brand-name{margin-top:.2rem;color:#d6baff;font-family:'Playfair Display',serif;font-size:3.2rem;letter-spacing:.02em}.categories{display:flex;gap:.55rem;overflow-x:auto;margin:1rem -1rem;padding:.25rem 1rem .7rem;scrollbar-width:none}.categories::-webkit-scrollbar,.amounts::-webkit-scrollbar{display:none}.category{flex:none;padding:.55rem .95rem;border:1px solid #3b3941;border-radius:999px;background:#242328;color:#aaa7b2;font:inherit}.category.active{border-color:#8e5cff;background:#231639;color:#e3d1ff}.carousel{position:relative;display:flex;align-items:center;justify-content:center;height:230px;overflow:hidden}.gift-card{display:grid;place-items:center;width:min(72vw,440px);height:190px;flex:none;position:relative;overflow:hidden;border:1px solid #7c54bd;border-radius:28px;background:radial-gradient(ellipse at 50% 45%,#4921a0,#241052 70%);box-shadow:0 18px 50px #0008;color:#dcbcff;transform:rotate(-2deg)}.gift-card:before,.gift-card:after{content:'';position:absolute;border:1px solid #d3a85e66}.gift-card:before{inset:12px 22px;border-radius:18px}.gift-card:after{left:18%;top:-25%;width:1px;height:150%;transform:rotate(-5deg);background:#d3a85e66}.gift-card .brand-mark{font-size:1.5rem}.gift-card small{font-size:.55rem;font-weight:800;letter-spacing:.2em}.card-glow{position:absolute;width:110px;height:110px;right:-28px;top:-25px;border-radius:50%;background:#ba83ff44;filter:blur(4px)}.dots{display:flex;justify-content:center;gap:.4rem;margin:-.2rem 0 1rem}.dots span{width:9px;height:9px;border-radius:99px;background:#555}.dots span.active{width:22px;background:#f0e9ff}.amount-box{padding:1.1rem;border:1px solid #29282e;border-radius:22px;background:#1d1d1f}.amount-box h2{margin:0 0 .75rem;font-size:1rem}.amount-display{display:flex;align-items:center;height:60px;padding:0 1rem;border:1px solid #343339;border-radius:16px;font-size:1.7rem;font-weight:800}.amount-display input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit}.amounts{display:flex;gap:.65rem;overflow-x:auto;margin:.8rem -.1rem 0;padding:.3rem 0;scrollbar-width:none}.amount-option{position:relative;min-width:100px;height:56px;border:1px solid #343339;border-radius:16px;background:#29282d;color:#fff;font:inherit;font-size:.95rem;font-weight:700}.amount-option.active{border-color:#5827cf;background:#4420a9}.amount-option small{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:.2rem .8rem;border:1px solid #555;border-radius:999px;background:#333;color:#eee;font-size:.65rem;font-weight:500}.redeem-line{margin:1.5rem 0;color:#d2d0d6;font-size:.88rem}.redeem-line a{color:#d3b7ff;text-decoration:underline;text-underline-offset:3px}.message-label{display:block;margin:1.6rem 0 .65rem;color:#aaa7b2;font-weight:600}.message{width:100%;min-height:120px;padding:1rem;border:1px solid #424047;border-radius:16px;resize:vertical;background:#151518;color:#fff;font:inherit}.message::placeholder{color:#77747e}.more-title{margin:1.7rem 0 .7rem;font-size:1rem}.more-options{overflow:hidden;border:1px solid #343339;border-radius:18px;background:#1b1a1f}.more-options a{display:flex;align-items:center;gap:.8rem;min-height:58px;padding:0 .9rem;color:#f5f3f8;text-decoration:none}.more-options a+a{border-top:1px solid #343339}.proceed-dock{position:fixed;z-index:4;right:0;bottom:0;left:0;padding:1rem 1.1rem calc(env(safe-area-inset-bottom) + 1rem);background:linear-gradient(transparent,#111 20%)}.proceed{width:100%;height:58px;border:0;border-radius:999px;background:#f7f6f9;color:#16151a;font:inherit;font-weight:800}.notice{margin:.5rem 0 0;color:#d5baff;text-align:center;font-size:.8rem}
    .gift-card[data-occasion="birthday"]{background:radial-gradient(ellipse at 50% 45%,#8a346a,#3d173d 72%)}.gift-card[data-occasion="anniversary"]{background:radial-gradient(ellipse at 50% 45%,#8d572b,#38251c 72%)}.gift-card[data-occasion="thank you"]{background:radial-gradient(ellipse at 50% 45%,#236b67,#153a40 72%)}.card-check{position:absolute;top:14px;right:15px;z-index:2;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#fff;color:#201333;font-size:1rem;font-weight:900}.history-overlay{position:fixed;z-index:20;inset:0;display:grid;align-items:end;background:#000a}.history-overlay[hidden]{display:none}.history-panel{width:100%;min-height:52vh;padding:1.1rem 1.1rem calc(env(safe-area-inset-bottom) + 1.2rem);border:1px solid #38363e;border-radius:24px 24px 0 0;background:#1b1a1f}.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}.history-head h2{margin:0;font-size:1.1rem}.history-close{width:40px;height:40px;border:1px solid #3c3a42;border-radius:50%;background:#27262c;color:#fff;font-size:1.5rem}.history-empty{display:grid;justify-items:center;gap:.7rem;padding:2.2rem 1rem;text-align:center;color:#a9a6b0}.history-icon{display:grid;place-items:center;width:58px;height:58px;border:1px solid #47434f;border-radius:50%;color:#c7a8ff;font-size:1.5rem}.history-empty h3{margin:.3rem 0 0;color:#f5f3f8;font-size:1rem}.history-empty p{max-width:280px;margin:0;font-size:.85rem;line-height:1.5}.history-empty a{margin-top:.4rem;color:#d3b7ff;font-size:.88rem;font-weight:700}
    .buy-page{width:min(100%,1200px);margin:0 auto;padding-right:clamp(1rem,3vw,2.5rem);padding-left:clamp(1rem,3vw,2.5rem)}
    .page-head{margin-right:calc(-1 * clamp(1rem,3vw,2.5rem));margin-left:calc(-1 * clamp(1rem,3vw,2.5rem));padding-right:clamp(1rem,3vw,2.5rem);padding-left:clamp(1rem,3vw,2.5rem)}
    .buy-hero{margin-right:0;margin-left:0;border:1px solid #4d3375;border-radius:20px}
    .categories{justify-content:center;margin-right:0;margin-left:0;flex-wrap:wrap}
    .carousel{height:270px}
    .gift-card{width:min(78vw,420px);height:auto;aspect-ratio:1.72;transform:none;border-radius:24px}
    .amount-box{max-width:850px;margin:0 auto}
    .redeem-line,.message-label,.message,.more-title,.more-options,.notice{display:block;width:min(100%,850px);margin-right:auto;margin-left:auto}
    @media(max-width:640px){.buy-page{width:100%;padding-right:1rem;padding-left:1rem}.page-head{margin-right:-1rem;margin-left:-1rem;padding-right:1rem;padding-left:1rem}.buy-hero{margin-right:-1rem;margin-left:-1rem;border:0;border-radius:0}.categories{justify-content:flex-start;margin-right:-1rem;margin-left:-1rem;flex-wrap:nowrap}.carousel{height:235px}.gift-card{width:min(82vw,380px)}}
    @media(min-width:800px){.proceed-dock{left:50%;width:min(100%,1200px);transform:translateX(-50%);padding-right:2.5rem;padding-left:2.5rem}}
  </style>
</head>
<body>
  <main class="buy-page">
    <header class="page-head"><button id="backButton" class="back-btn" aria-label="Back">‹</button><h1>Buy Gift Card</h1><button class="history-btn" id="historyButton">◴ &nbsp;History</button></header>
    <section class="buy-hero"><div class="brand"><div class="brand-mark">CultureWave</div><div class="brand-name">GIFT CARD</div></div></section>
    <nav class="categories" aria-label="Gift card occasion"><button class="category active" data-category="all" aria-pressed="true">All</button><button class="category" data-category="culturewave" aria-pressed="false">CultureWave</button><button class="category" data-category="birthday" aria-pressed="false">Birthday</button><button class="category" data-category="anniversary" aria-pressed="false">Anniversary</button><button class="category" data-category="thank you" aria-pressed="false">Thank you</button></nav>
    <section class="carousel" aria-label="Gift card design"><div class="gift-card" id="giftCard" data-occasion="all"><span class="card-glow"></span><span class="card-check" aria-label="Selected">✓</span><div><div class="brand-mark" id="giftCardBrand">CultureWave</div><small id="giftCardCaption">CULTUREWAVE GIFT CARD</small></div></div></section>
    <div class="dots" aria-hidden="true"><span class="active"></span><span></span><span></span><span></span><span></span></div>
    <section class="amount-box"><h2>Choose amount</h2><label class="amount-display"><span>₹</span><input id="amountInput" aria-label="Gift card amount" inputmode="numeric" value="2000"></label><div class="amounts"><button class="amount-option">₹1,000</button><button class="amount-option active"><small>Popular</small>₹2,000</button><button class="amount-option">₹5,000</button><button class="amount-option">₹10,000</button></div></section>
    <p class="redeem-line">Already have a gift card? <a href="claim-gift-card.html">Redeem now</a></p>
    <label class="message-label" for="customMessage">Add a custom message:</label><textarea class="message" id="customMessage" placeholder="Start typing here..."></textarea>
    <h2 class="more-title">More options</h2><nav class="more-options"><a href="customer-service.html"><span>▦</span><strong>Help</strong><span>›</span></a></nav>
    <p id="buyNotice" class="notice" role="status"></p>
  </main>
  <footer class="proceed-dock"><button class="proceed" id="proceedButton">Proceed &nbsp;›</button></footer>
  <div class="history-overlay" id="historyOverlay" hidden><section class="history-panel" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><header class="history-head"><h2 id="historyTitle">Gift Card History</h2><button class="history-close" id="historyClose" aria-label="Close history">×</button></header><div id="historyContent" class="history-empty"><span class="history-icon">◷</span><h3>Sign in to view purchases</h3><p>Your CultureWave gift card orders will appear here.</p><a href="gift-card-faq.html">Gift Card FAQs</a></div></section></div>
  <script type="module">
    import {auth as giftAuth} from "./firebase.js";
    /* Firebase initialization is shared with the login page. */
    const giftApi="https://culturewave-razorpay.culturewaveindia.workers.dev";
    const currentUser=async()=>{await giftAuth.authStateReady();return giftAuth.currentUser};
    async function giftRequest(path,data){const user=await currentUser();if(!user)throw new Error('Please sign in to continue.');const token=await user.getIdToken(true);const response=await fetch(`${giftApi}/${path}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(data||{})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||'Could not complete request.');return result}
    document.getElementById('backButton').addEventListener('click',()=>{if(parent!==window)parent.postMessage({type:'culturewave-menu-back'},location.origin);else history.back()});
    const historyOverlay=document.getElementById('historyOverlay');
    document.getElementById('historyButton').addEventListener('click',async()=>{historyOverlay.hidden=false;document.getElementById('historyClose').focus();const content=document.getElementById('historyContent');content.className='history-empty';content.innerHTML='<p>Loading your gift card history…</p>';try{const user=await currentUser();if(!user){content.innerHTML='<span class="history-icon">◷</span><h3>Sign in to view purchases</h3><p>Your CultureWave gift card orders will appear here.</p><a href="login.html?next=buy-gift-card.html">Sign in</a>';return}const {purchases}=await giftRequest('giftCardHistory');if(!purchases.length){content.innerHTML='<span class="history-icon">◷</span><h3>No gift card history yet</h3><p>Completed gift card orders will show up here.</p><a href="gift-card-faq.html">Gift Card FAQs</a>';return}content.className='history-list';content.innerHTML=purchases.map((item,index)=>`<article class="history-item"><strong>CultureWave Gift Card · ₹${Number(item.amount).toLocaleString('en-IN')}</strong><span>${item.status==='redeemed'?'Redeemed':'Purchased'} · ${new Date(item.createdAt).toLocaleDateString('en-IN')}</span><button type="button" class="reveal-card" data-index="${index}">View gift card code &amp; PIN</button><p class="gift-credentials" id="giftCredentials${index}" hidden>Code: <strong>${item.code}</strong><br>PIN: <strong>${item.pin}</strong></p></article>`).join('');content.querySelectorAll('.reveal-card').forEach(button=>button.addEventListener('click',()=>{const card=content.querySelector(`#giftCredentials${button.dataset.index}`);card.hidden=!card.hidden;button.textContent=card.hidden?'View gift card code & PIN':'Hide code & PIN'}))}catch(error){const user=await currentUser().catch(()=>null);content.className='history-empty';if(!user){content.innerHTML='<span class="history-icon">◷</span><h3>Sign in to view purchases</h3><p>Your CultureWave gift card orders will appear here.</p><a href="login.html?next=buy-gift-card.html">Sign in</a>';return}content.innerHTML=`<span class="history-icon">!</span><h3>Could not load history</h3><p>${error.message}</p><button type="button" id="historyRetry" class="history-close" style="width:auto;padding:0 1rem;font-size:.85rem">Try again</button>`;document.getElementById('historyRetry').addEventListener('click',()=>document.getElementById('historyButton').click())}});
    document.getElementById('historyClose').addEventListener('click',()=>{historyOverlay.hidden=true;document.getElementById('historyButton').focus()});
    historyOverlay.addEventListener('click',event=>{if(event.target===historyOverlay)historyOverlay.hidden=true});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!historyOverlay.hidden)historyOverlay.hidden=true});
    const categoryCaptions={all:'CULTUREWAVE GIFT CARD',culturewave:'CULTUREWAVE GIFT CARD',birthday:'HAPPY BIRTHDAY',anniversary:'HAPPY ANNIVERSARY','thank you':'THANK YOU'};
    document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.category.active')?.classList.remove('active');button.classList.add('active');document.querySelectorAll('.category').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));const category=button.dataset.category;document.getElementById('giftCard').dataset.occasion=category;document.getElementById('giftCardBrand').textContent='CultureWave';document.getElementById('giftCardCaption').textContent=categoryCaptions[category]||'CULTUREWAVE GIFT CARD'}));
    document.querySelectorAll('.amount-option').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.amount-option.active')?.classList.remove('active');button.classList.add('active');document.getElementById('amountInput').value=button.textContent.replace(/\D/g,'')}));
    document.getElementById('proceedButton').addEventListener('click',async()=>{const notice=document.getElementById('buyNotice'),button=document.getElementById('proceedButton');button.disabled=true;notice.textContent='Opening secure checkout…';try{let user=await currentUser();if(!user){location.href='login.html?next=buy-gift-card.html';return}const amount=Number(document.getElementById('amountInput').value);if(!Number.isSafeInteger(amount)||amount<250||amount>10000)throw new Error('Gift card amount must be between ₹250 and ₹10,000.');if(typeof Razorpay==='undefined')throw new Error('Secure checkout could not load. Refresh and try again.');const occasion=document.querySelector('.category.active')?.dataset.category||'culturewave';const {razorpayOrderId,keyId,amount:paise}=await giftRequest('createGiftCardOrder',{amount,occasion,message:document.getElementById('customMessage').value});const checkout=new Razorpay({key:keyId,order_id:razorpayOrderId,amount:paise,currency:'INR',name:'CultureWave',description:'CultureWave Gift Card',prefill:{email:user.email||''},theme:{color:'#7b48ce'},handler:async response=>{try{user=giftAuth.currentUser;const result=await giftRequest('verifyGiftCardPayment',response);notice.innerHTML=`Payment confirmed. Save your gift card code and PIN:<br><strong>Code: ${result.giftCard.code}</strong><br><strong>PIN: ${result.giftCard.pin}</strong><br>Amount: ₹${Number(result.giftCard.amount).toLocaleString('en-IN')}<br><a href="one-club.html">Go to One Club</a>`}catch(error){notice.textContent=`Payment may have completed, but gift card confirmation failed: ${error.message}. Do not pay again; contact CultureWave support.`}finally{button.disabled=false;button.textContent='Proceed ›'}}});checkout.on('payment.failed',response=>{notice.textContent=response.error?.description||'Payment was not completed.';button.disabled=false;button.textContent='Proceed ›'});checkout.open()}catch(error){notice.textContent=error.message;button.disabled=false;button.textContent='Proceed ›'}});
  </script>
</body>
</html>
